<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakoto</title>
    <script>
      // Set the palette before styles load and React mounts.
      try {
        let restored;
        try {
          restored = JSON.parse(localStorage.getItem("hakoto.restoredPreferences") ?? "null");
        } catch {
          // Individual preferences still work if the restore record is unavailable.
        }
        const read = key => restored?.values?.[key] ?? localStorage.getItem(key);
        const theme = read("hakoto.theme");
        if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "light";
        }
        const scale = read("hakoto.textScale");
        document.documentElement.dataset.textScale = ["90", "100", "115", "130"].includes(scale) ? scale : "100";
        document.documentElement.dataset.animations = read("hakoto.animations") === "off" ? "off" : "on";
        const duration = read("hakoto.animationDuration");
        if (["100", "150", "200", "250", "300", "350", "400", "450", "500"].includes(duration)) {
          document.documentElement.style.setProperty("--animation-duration", duration + "ms");
        }
      } catch {
        // Use default appearance when preferences are unavailable.
      }
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
