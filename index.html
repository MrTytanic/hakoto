<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakoto</title>
    <script>
      // Set the palette before styles load and React mounts.
      try {
        const theme = localStorage.getItem("hakoto.theme");
        if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Keep the default dark palette when storage is unavailable.
      }
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
